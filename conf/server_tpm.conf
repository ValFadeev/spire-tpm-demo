server {
    bind_address = "0.0.0.0"
    bind_port = "8081"

    trust_domain = "example.org"

    data_dir = "/opt/spire/data/server"
    socket_path = "/opt/spire/data/server/server.sock"

    log_level = "DEBUG"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

    NodeAttestor "tpm" {
        plugin_cmd = "/opt/spire/bin/tpm_attestor_server"

        plugin_data {
            hash_path = "/opt/spire/tpm-hashes"
        }
    }
}
