---
- name: Create SPIRE agent group
  ansible.builtin.group:
    name: "{{ spire_agent_group }}"
    system: true
    state: present

- name: Create SPIRE agent user
  ansible.builtin.user:
    name: "{{ spire_agent_user }}"
    group: "{{ spire_agent_group }}"
    groups:
      - tss
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ spire_data_dir }}"
    create_home: false
    state: present

- name: Create SPIRE directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ spire_base_dir }}",   owner: root, group: root, mode: "0755" }
    - { path: "{{ spire_bin_dir }}",    owner: root, group: root, mode: "0755" }
    - { path: "{{ spire_plugin_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ spire_config_dir }}", owner: root, group: "{{ spire_agent_group }}", mode: "0750" }

- name: Inspect existing attestor marker
  ansible.builtin.stat:
    path: "{{ spire_config_dir }}/.attestor-mode"
  register: attestor_marker

- name: Read existing attestor marker
  ansible.builtin.slurp:
    path: "{{ spire_config_dir }}/.attestor-mode"
  register: attestor_marker_contents
  when: attestor_marker.stat.exists

- name: Inspect existing SPIRE agent configuration
  ansible.builtin.stat:
    path: "{{ spire_config_dir }}/agent.conf"
  register: existing_agent_config

- name: Read existing SPIRE agent configuration
  ansible.builtin.slurp:
    path: "{{ spire_config_dir }}/agent.conf"
  register: existing_agent_config_contents
  when:
    - not attestor_marker.stat.exists
    - existing_agent_config.stat.exists

- name: Determine previously deployed attestor
  ansible.builtin.set_fact:
    previous_spire_attestor: >-
      {%- if attestor_marker.stat.exists -%}
      {{ attestor_marker_contents.content | b64decode | trim }}
      {%- elif existing_agent_config.stat.exists -%}
      {%- set old_config = existing_agent_config_contents.content | b64decode -%}
      {%- if 'NodeAttestor "tpm_devid"' in old_config -%}
      tpm_devid
      {%- elif 'NodeAttestor "tpm"' in old_config -%}
      tpm
      {%- else -%}
      unknown
      {%- endif -%}
      {%- else -%}
      none
      {%- endif -%}

- name: Install SPIRE agent binary
  ansible.builtin.copy:
    src: "{{ local_bin_dir }}/spire-agent"
    dest: "{{ spire_agent_binary }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart SPIRE agent

- name: Install SPIRE bootstrap bundle
  ansible.builtin.copy:
    src: "{{ local_bootstrap_bundle }}"
    dest: "{{ spire_config_dir }}/bootstrap.crt"
    owner: root
    group: "{{ spire_agent_group }}"
    mode: "0644"
  register: bootstrap_bundle_install
  notify: Restart SPIRE agent

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop SPIRE agent before state reset
  ansible.builtin.systemd_service:
    name: spire-agent
    state: stopped
  when:
    - "'spire-agent.service' in ansible_facts.services"
    - >
      spire_reset_state | bool
      or (previous_spire_attestor not in ["none", "unknown"] and previous_spire_attestor != spire_attestor)
      or bootstrap_bundle_install.changed
      or (spire_attestor == "tpm_devid" and spire_reprovision_devid | bool)

- name: Remove stale SPIRE agent state when required
  ansible.builtin.file:
    path: "{{ spire_data_dir }}"
    state: absent
  when: >
    spire_reset_state | bool
    or (previous_spire_attestor not in ["none", "unknown"] and previous_spire_attestor != spire_attestor)
    or bootstrap_bundle_install.changed
    or (spire_attestor == "tpm_devid" and spire_reprovision_devid | bool)

- name: Create SPIRE agent data directory
  ansible.builtin.file:
    path: "{{ spire_data_dir }}"
    state: directory
    owner: "{{ spire_agent_user }}"
    group: "{{ spire_agent_group }}"
    mode: "0750"
